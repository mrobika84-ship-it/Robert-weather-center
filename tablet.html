<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>Róbert kijelző</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101a}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="screen" allow="fullscreen"></iframe><script>
const pages=['https://robert-weather-center.pages.dev/','markets.html','dogs.html'];let current=0,timer;
function urlFor(i){const u=pages[i];return u+(u.includes('?')?'&':'?')+'v6='+Date.now()}
function next(){current=(current+1)%pages.length;document.getElementById('screen').src=urlFor(current);timer=setTimeout(next,15000)}
document.getElementById('screen').src=urlFor(0);timer=setTimeout(next,15000);
</script></body></html>
