<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06101a">
  <title>Robert Weather Center V8.7 Dynamic</title>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/weather.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/tv.css">
  <link rel="stylesheet" href="css/v87.css">
</head>
<body class="weather-clear time-day">
  <div class="background" aria-hidden="true"></div>
  <div class="time-tint" aria-hidden="true"></div>

  <div class="weather-effects" aria-hidden="true">
    <div class="sun-glow"></div>
    <div class="cloud cloud-a"></div>
    <div class="cloud cloud-b"></div>
    <div class="cloud cloud-c"></div>
    <div class="rain"></div>
    <div class="snow"></div>
    <div class="fog"></div>
    <div class="stars"></div>
    <div class="lightning"></div>
  </div>

  <div class="dashboard-shell">
    <header id="appHeader"></header>

    <main class="layout">
      <section id="outdoorPanel" class="panel outdoor-panel"></section>
      <section id="indoorPanel" class="panel indoor-panel"></section>
      <section id="trendPanel" class="panel trend-panel"></section>
      <section id="forecastPanel" class="panel forecast-panel"></section>
      <section id="radarPanel" class="panel radar-panel"></section>
      <section id="alertsPanel" class="panel alerts-panel"></section>
    </main>

    <footer id="appFooter" class="footerbar"></footer>
  </div>

  <script src="config.js"></script>
  <script src="effects.js"></script>
  <script src="components/widgets.js"></script>
  <script src="components/outdoor.js"></script>
  <script src="components/indoor.js"></script>
  <script src="components/charts.js"></script>
  <script src="components/forecast.js"></script>
  <script src="components/radar.js"></script>
  <script src="components/alerts.js"></script>
  <script src="components/ai.js"></script>
  <script src="app.js"></script>
</body>
</html>
