<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101a"><title>Robert Tablet Display</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101a}iframe{display:block;width:100%;height:100%;border:0}</style></head>
<body><iframe id="screen" src="https://robert-weather-center.pages.dev/" allow="fullscreen"></iframe><script>
const pages=['https://robert-weather-center.pages.dev/','markets.html','dogs.html'];let current=0;
function showPage(){const url=pages[current],separator=url.includes('?')?'&':'?';document.getElementById('screen').src=url+separator+'t='+Date.now()}
setInterval(()=>{current=(current+1)%pages.length;showPage()},30000);
</script></body></html>
