<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>DGB • Kryptex PPS+</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#fff;font-family:Arial,sans-serif;min-height:100vh;padding:3.2vh 4vw;background:linear-gradient(rgba(3,10,20,.78),rgba(3,7,16,.92)),radial-gradient(circle at 78% 18%,rgba(0,154,255,.20),transparent 30%),linear-gradient(135deg,#03101f 0%,#071b31 45%,#030912 100%);overflow:hidden}
body:before{content:"D";position:fixed;right:3vw;top:0;font-size:43vw;font-weight:900;color:rgba(42,169,255,.055);transform:rotate(-10deg);z-index:-1}
.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:2.4vh}.title{font-size:3.5vw;font-weight:900}.sub{color:#59bfff;font-size:1.35vw}.live{color:#49e38a;font-size:1.4vw;font-weight:800}.error{color:#fb7185}
.hero{background:linear-gradient(135deg,rgba(8,42,70,.95),rgba(5,17,31,.95));border:1px solid rgba(72,174,255,.4);border-radius:24px;padding:1.8vw 2.4vw;margin-bottom:1.5vw;box-shadow:0 0 38px rgba(0,132,255,.14);display:flex;align-items:center;justify-content:space-between}.label{color:#a7bdd0;font-size:1.2vw;margin-bottom:.8vh}.hero .label{font-size:1.45vw}.hero .value{font-size:6.1vw;line-height:1;font-weight:900;color:#61c4ff;text-shadow:0 0 28px rgba(51,169,255,.25)}.heroMark{font-size:4vw;font-weight:900;color:rgba(97,196,255,.32);text-align:right}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.25vw}.card{background:rgba(7,18,30,.92);border:1px solid rgba(72,126,166,.32);border-radius:18px;padding:1.55vw;min-height:16.5vh}.value{font-size:2.65vw;font-weight:850;color:#d9efff}.green{color:#65e69a}.blue{color:#61c4ff}.orange{color:#f6c85f}.small{font-size:1.05vw;color:#829db1;margin-top:.7vh}.footer{margin-top:1.7vh;text-align:center;color:#687f91;font-size:1vw}
</style></head><body>
<div class="top"><div><div class="title">DigiByte • Kryptex</div><div class="sub">NerdQaxe • PPS+ • SHA-256 • EU</div></div><div id="status" class="live">● BETÖLTÉS</div></div>
<div class="hero"><div><div class="label">AKTUÁLIS HASHRATE • 30 PERC</div><div id="hash" class="value">—</div></div><div class="heroMark">DGB<br><span style="font-size:1.7vw">KRYPTEX PPS+</span></div></div>
<div class="grid">
<div class="card"><div class="label">3 ÓRÁS ÁTLAG</div><div id="avg3" class="value blue">—</div></div>
<div class="card"><div class="label">24 ÓRÁS ÁTLAG</div><div id="avg24" class="value blue">—</div></div>
<div class="card"><div class="label">WORKER</div><div id="worker" class="value green">nerdqaxe1</div><div id="valid" class="small">Valid share: —</div></div>
<div class="card"><div class="label">EGYENLEG</div><div id="balance" class="value orange">—</div><div class="small">Kryptex • megerősített DGB</div></div>
</div>
<div class="footer">dgb1qt2w8z6k8…m2m3hl • nerdqaxe1 • frissítés 10 másodpercenként</div>
<script>
const ADDRESS='dgb1qt2w8z6k8tura70rufzrcvpyw89fverkrm2m3hl';
const BASE='https://pool.kryptex.com/dgb/api';
const fmtHash=n=>{n=Number(n||0);if(!n)return '0 H/s';const u=['H/s','KH/s','MH/s','GH/s','TH/s','PH/s'];let i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}return (n>=100?n.toFixed(0):n>=10?n.toFixed(1):n.toFixed(2))+' '+u[i]};
const pick=(o,...ks)=>{for(const k of ks){if(o&&o[k]!=null)return o[k]}return 0};
async function json(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}
async function load(){try{
 const [wd,bd]=await Promise.all([json(BASE+'/v3/miner/workers/'+ADDRESS),json(BASE+'/v1/miner/balance/'+ADDRESS)]);
 const list=Array.isArray(wd)?wd:(wd.workers||wd.data||wd.result||[]);
 const w=list.find(x=>String(x.name||x.worker||x.worker_name||'').toLowerCase()==='nerdqaxe1')||list[0]||{};
 const h30=pick(w,'hashrate_30m','hashrate30m','hashrate','hashrate_30min','hashrate30');
 const h3=pick(w,'hashrate_3h','hashrate3h','hashrate_3hour','hashrate3');
 const h24=pick(w,'hashrate_24h','hashrate24h','hashrate_24hour','hashrate24');
 document.getElementById('hash').textContent=typeof h30==='string'&&/[a-z]/i.test(h30)?h30:fmtHash(h30);
 document.getElementById('avg3').textContent=typeof h3==='string'&&/[a-z]/i.test(h3)?h3:fmtHash(h3);
 document.getElementById('avg24').textContent=typeof h24==='string'&&/[a-z]/i.test(h24)?h24:fmtHash(h24);
 document.getElementById('worker').textContent=w.name||w.worker||w.worker_name||'nerdqaxe1';
 document.getElementById('valid').textContent='Valid share: '+pick(w,'valid','valid_shares','shares_valid','accepted');
 const bal=pick(bd,'confirmed','balance','confirmed_balance','amount')||pick(bd.data||{},'confirmed','balance','confirmed_balance','amount');
 document.getElementById('balance').textContent=Number(bal||0).toLocaleString('hu-HU',{maximumFractionDigits:8})+' DGB';
 const on=Number(h30)>0||String(h30).match(/[1-9]/);
 document.getElementById('status').textContent=on?'● MINING – ACTIVE':'● OFFLINE';
 document.getElementById('status').className=on?'live':'live error';
}catch(e){document.getElementById('status').textContent='● ADATHIBA';document.getElementById('status').className='live error'}}
load();setInterval(load,10000);
</script></body></html>
