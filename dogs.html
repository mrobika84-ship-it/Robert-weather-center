<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182217"><title>Happy & Honey</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172116;font-family:Segoe UI,Arial,sans-serif}
body{background:radial-gradient(circle at 50% 30%,#42533a 0%,#22301f 42%,#10170f 100%)}
body:before,body:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.045);pointer-events:none}
body:before{width:58vw;height:58vw;left:-28vw;top:-20vw}body:after{width:52vw;height:52vw;right:-25vw;bottom:-25vw}
.photo{position:absolute;z-index:1;top:0;bottom:0;left:50%;width:min(1050px,100vw);transform:translateX(-50%);background:url('assets/happy-honey.jpg') center center/cover no-repeat;box-shadow:0 0 90px rgba(0,0,0,.88)}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,10,4,.65) 0%,transparent 25%,transparent 78%,rgba(5,10,4,.12) 100%)}
.names{position:absolute;z-index:2;left:50%;bottom:34px;transform:translateX(-50%);width:min(820px,78vw);display:flex;justify-content:space-between;pointer-events:none}
.name{min-width:220px;text-align:center;color:white;font-size:46px;font-weight:800;text-shadow:0 4px 22px rgba(0,0,0,.95);padding:9px 26px 11px;border-radius:999px;background:rgba(8,14,7,.45);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(8px)}
@media(max-aspect-ratio:1/1){
 .photo{width:100vw;background-size:180% auto;background-position:center 50%}
 .names{width:88vw;bottom:28px}
 .name{font-size:34px;min-width:145px;padding:8px 18px 10px}
}
</style></head><body><div class="photo"></div><div class="names"><div class="name">Happy</div><div class="name">Honey</div></div></body></html>
